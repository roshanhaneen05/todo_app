<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster Pro - Containerized Full-Stack To-Do App</title>
    <meta name="description" content="Production-ready containerized Full-Stack To-Do Application powered by Python Flask, MySQL, and Nginx.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- App Custom Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-background">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- App Header -->
        <header class="app-header">
            <div class="header-brand">
                <div class="logo-icon">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
                <div>
                    <h1 class="app-title">TaskMaster <span class="badge-pro">PRO</span></h1>
                    <p class="app-subtitle">DevOps Containerized Flask &amp; MySQL Task Platform</p>
                </div>
            </div>
            
            <div class="system-status">
                <span class="status-indicator online" id="status-indicator"></span>
                <span class="status-text" id="status-text">System Healthy</span>
            </div>
        </header>

        <!-- Stats Overview Cards -->
        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon total"><i class="fa-solid fa-list-check"></i></div>
                <div class="stat-info">
                    <span class="stat-label">Total Tasks</span>
                    <span class="stat-value" id="stat-total">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon pending"><i class="fa-solid fa-clock"></i></div>
                <div class="stat-info">
                    <span class="stat-label">Pending</span>
                    <span class="stat-value" id="stat-pending">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon completed"><i class="fa-solid fa-circle-check"></i></div>
                <div class="stat-info">
                    <span class="stat-label">Completed</span>
                    <span class="stat-value" id="stat-completed">0</span>
                </div>
            </div>
        </section>

        <!-- Main Workspace -->
        <main class="workspace-grid">
            <!-- Add Task Form Card -->
            <section class="card form-card">
                <div class="card-header">
                    <h2><i class="fa-solid fa-plus-circle"></i> Create New Task</h2>
                </div>
                <form id="task-form" class="task-form">
                    <div class="form-group">
                        <label for="task-title">Task Title <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-heading input-icon"></i>
                            <input type="text" id="task-title" placeholder="e.g. Deploy Flask container to Docker Swarm..." required autocomplete="off">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="task-desc">Task Description</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-align-left input-icon textarea-icon"></i>
                            <textarea id="task-desc" placeholder="Add additional implementation details or context (optional)..." rows="3"></textarea>
                        </div>
                    </div>
                    <button type="submit" id="add-task-btn" class="btn btn-primary btn-block">
                        <i class="fa-solid fa-plus"></i> Add Task
                    </button>
                </form>
            </section>

            <!-- Task List Card -->
            <section class="card list-card">
                <div class="card-header list-header">
                    <h2><i class="fa-solid fa-tasks"></i> Task Workspace</h2>
                    <!-- Filters -->
                    <div class="filter-tabs">
                        <button class="filter-btn active" data-filter="all" id="filter-all">
                            All (<span id="count-all">0</span>)
                        </button>
                        <button class="filter-btn" data-filter="pending" id="filter-pending">
                            Pending (<span id="count-pending">0</span>)
                        </button>
                        <button class="filter-btn" data-filter="completed" id="filter-completed">
                            Completed (<span id="count-completed">0</span>)
                        </button>
                    </div>
                </div>

                <!-- Loading State -->
                <div id="loading-spinner" class="loading-state hidden">
                    <div class="spinner"></div>
                    <p>Loading tasks from database...</p>
                </div>

                <!-- Empty State Message -->
                <div id="empty-state" class="empty-state hidden">
                    <div class="empty-icon"><i class="fa-solid fa-clipboard-check"></i></div>
                    <h3>No Tasks Found</h3>
                    <p id="empty-state-text">Your task list is empty! Create your first task above to get started.</p>
                </div>

                <!-- Task List Container -->
                <div id="task-list" class="task-list"></div>
            </section>
        </main>
    </div>

    <!-- Edit Task Modal -->
    <div id="edit-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fa-solid fa-pen-to-square"></i> Edit Task</h3>
                <button type="button" class="close-modal-btn" id="close-modal-btn">&times;</button>
            </div>
            <form id="edit-task-form">
                <input type="hidden" id="edit-task-id">
                <div class="form-group">
                    <label for="edit-task-title">Title <span class="required">*</span></label>
                    <input type="text" id="edit-task-title" required class="modal-input">
                </div>
                <div class="form-group">
                    <label for="edit-task-desc">Description</label>
                    <textarea id="edit-task-desc" rows="4" class="modal-input"></textarea>
                </div>
                <div class="form-group checkbox-group">
                    <label class="custom-checkbox">
                        <input type="checkbox" id="edit-task-completed">
                        <span class="checkmark"></span>
                        Mark as Completed
                    </label>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-modal-btn">Cancel</button>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save"></i> Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- App JavaScript -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
